name: Build YouMod IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      opensafari:
        description: "Integrate Open in YouTube (Safari Extension)"
        default: true
        required: false
        type: boolean

      youpip:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Integrate YTUHD"
        default: true
        required: false
        type: boolean

      ryd:
        description: "Integrate Return YouTube Dislikes"
        default: true
        required: false
        type: boolean

      ytabconfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      youquality:
        description: "Integrate YouQuality"
        default: true
        required: false
        type: boolean

      youchoose:
        description: "Integrate YouChooseQuality"
        default: true
        required: false
        type: boolean

      youslider:
        description: "Integrate YouSlider"
        default: true
        required: false
        type: boolean

      ytsilentvote:
        description: "Integrate YTSilentVote"
        default: true
        required: false
        type: boolean

      ytweaks:
        description: "Integrate YTweaks"
        default: true
        required: false
        type: boolean

      gonerino:
        description: "Integrate Gonerino"
        default: true
        required: false
        type: boolean

      yougetcaption:
        description: "Integrate YouGetCaption"
        default: true
        required: false
        type: boolean

      youspeed:
        description: "Integrate YouSpeed"
        default: true
        required: false
        type: boolean

      youmute:
        description: "Integrate YouMute"
        default: true
        required: false
        type: boolean

      youloop:
        description: "Integrate YouLoop"
        default: true
        required: false
        type: boolean

      demc:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      isponsorblock:
        description: "Integrate iSponsorBlock"
        default: true
        required: false
        type: boolean

      youmod:
        description: "Integrate YouMod"
        default: true
        required: false
        type: boolean

      youpro:
        description: "Integrate YouPro (Optional)"
        default: false
        required: false
        type: boolean

      alderis:
        description: "Integrate Alderis (Color Picker)"
        default: true
        required: false
        type: boolean

      ytkace:
        description: "Integrate YTKace"
        default: false
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      youpro: ${{ inputs.youpro }}
      youmod: ${{ inputs.youmod }}
      isponsorblock: ${{ inputs.isponsorblock }}
      demc: ${{ inputs.demc }}
      youpip: ${{ inputs.youpip }}
      ytuhd: ${{ inputs.ytuhd }}
      ryd: ${{ inputs.ryd }}
      ytabconfig: ${{ inputs.ytabconfig }}
      youquality: ${{ inputs.youquality }}
      youslider: ${{ inputs.youslider }}
      ytsilentvote: ${{ inputs.ytsilentvote }}
      ytweaks: ${{ inputs.ytweaks }}
      youchoose: ${{ inputs.youchoose }}
      gonerino: ${{ inputs.gonerino }}
      yougetcaption: ${{ inputs.yougetcaption }}
      youspeed: ${{ inputs.youspeed }}
      youmute: ${{ inputs.youmute }}
      youloop: ${{ inputs.youloop }}
      opensafari: ${{ inputs.opensafari }}
      alderis: ${{ inputs.alderis }}
      ytkace: ${{ inputs.ytkace }}

  package:
    name: Build YouMod IPA
    runs-on: macos-latest
    needs: build-tweaks
    permissions:
      contents: write
    env:
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: Download Built Debs
        uses: actions/download-artifact@v8.0.1
        with:
          name: built-debs
          path: ${{ github.workspace }}

      - name: List Downloaded Files
        run: |
          echo "Files downloaded from artifacts:"
          ls -la *.deb 2>/dev/null || echo "No .deb files found"
          ls -la *.appex 2>/dev/null || echo "No .appex files found"

      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@1.2.0
        with:
          exclude_inputs: bundle_id,display_name,demc,isponsorblock,opensafari,youpip,ytuhd,ryd,ytabconfig,youquality,youslider,ytsilentvote,ytweaks,youchoose,gonerino,yougetcaption,youspeed,youmute,youloop,youmod,youpro,alderis,ytkace

      - name: Download and Validate IPA
        run: |
          echo "Downloading IPA from: ${{ inputs.ipa_url }}"
          
          # Download with follow redirects and show headers
          wget --quiet --no-verbose --header="Accept: application/octet-stream,application/zip,application/x-ios-app,*/*" --header="User-Agent: Mozilla/5.0" "${{ inputs.ipa_url }}" -O youtube.ipa || wget --quiet --no-verbose --header="Accept: application/octet-stream,application/zip,application/x-ios-app,*/*" "${{ inputs.ipa_url }}" -O youtube.ipa
          
          # Check if file exists and has content
          if [ ! -f youtube.ipa ]; then
            echo "::error::Download failed: File not found"
            exit 1
          fi
          
          # Check file size
          file_size=$(stat -f%z youtube.ipa 2>/dev/null || stat -c%s youtube.ipa 2>/dev/null || echo "0")
          if [ "$file_size" -lt 1000000 ]; then
            echo "::error::Downloaded file is too small ($file_size bytes). This likely means the URL is invalid or requires authentication."
            echo "File content preview:"
            head -c 500 youtube.ipa
            exit 1
          fi
          
          # Check file type
          file_type=$(file --mime-type -b youtube.ipa)
          echo "File type: $file_type"
          echo "File size: $file_size bytes"
          
          # Try to identify if it's HTML
          if head -c 100 youtube.ipa | grep -q "<html\|<!DOCTYPE"; then
            echo "::error::Downloaded file appears to be HTML, not an IPA. The URL likely points to a webpage instead of the actual IPA file."
            echo "HTML preview:"
            head -c 500 youtube.ipa
            exit 1
          fi
          
          # Validate it's a zip file
          if ! file youtube.ipa | grep -q "Zip archive"; then
            echo "::error::Downloaded file is not a valid Zip archive. File type: $(file youtube.ipa)"
            exit 1
          fi
          
          echo "✅ IPA file validated successfully!"

      - name: Get YouTube Version
        run: |
          unzip -q youtube.ipa -d ytextracted
          echo "YT_VERSION=$(grep -A 1 'CFBundleVersion' ytextracted/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV
          rm -rf ytextracted

      - name: Get YouMod Version
        if: inputs.youmod == true
        run: |
          if [ ! -f "youmod.deb" ]; then
            echo "::warning::youmod.deb not found - using default version"
            echo "YOUMOD_VERSION=unknown" >> $GITHUB_ENV
            exit 0
          fi
          mkdir _youmod_extract && cd _youmod_extract
          ar x "../youmod.deb" >/dev/null 2>&1
          if [ -f control.tar.gz ]; then
            tar -xzf control.tar.gz ./control
          elif [ -f control.tar.xz ]; then
            tar -xJf control.tar.xz ./control
          elif [ -f control.tar.zst ]; then
            tar --zstd -xf control.tar.zst ./control
          else
            echo "::warning::Could not find control tarball in youmod.deb"
            echo "YOUMOD_VERSION=unknown" >> $GITHUB_ENV
            cd .. && rm -rf _youmod_extract
            exit 0
          fi
          VERSION=$(grep '^Version:' control | awk '{print $2}' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "::warning::Could not extract version from youmod.deb control file"
            echo "YOUMOD_VERSION=unknown" >> $GITHUB_ENV
          else
            echo "YOUMOD_VERSION=$VERSION" >> $GITHUB_ENV
          fi
          cd .. && rm -rf _youmod_extract

      - name: Set Default YouMod Version
        if: inputs.youmod != true
        run: |
          echo "YOUMOD_VERSION=disabled" >> $GITHUB_ENV

      - name: Install cyan
        run: |
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject Tweaks Into IPA
        run: |
          tweaks=""
          if [ "${{ inputs.opensafari }}" = "true" ] && [ -e "OpenYouTubeSafariExtension.appex" ]; then
            tweaks="OpenYouTubeSafariExtension.appex"
          fi
          for f in *.deb; do
            [ -f "$f" ] && tweaks="$tweaks $f"
          done
          cyan -i youtube.ipa -o YouModExtra_${{ env.YT_VERSION }}_${{ env.YOUMOD_VERSION }}.ipa -uwesf $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      - name: Create a Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          i=1
          while gh release view "youmodextra-ipa${i}" --repo "$GITHUB_REPOSITORY" &>/dev/null; do
            i=$(( i + 1 ))
          done
          gh release create "youmodextra-ipa${i}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "YouModExtra_${{ env.YT_VERSION }}_${{ env.YOUMOD_VERSION }}" \
            --draft \
            YouModExtra_${{ env.YT_VERSION }}_${{ env.YOUMOD_VERSION }}.ipa

      - name: Job Summary - Build Complete
        run: echo -e '### 🛠️ Build YouMod IPA Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Draft Release Link
        run: |
          echo -e "### 🚀 Draft Release\n\nDraft release has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases" >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Cleanup
        run: |
          echo -e "### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflows-run.yml And if you want to delete old draft releases you have then here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-draft-releases.yml" >> $GITHUB_STEP_SUMMARY
